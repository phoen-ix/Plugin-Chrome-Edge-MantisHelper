name: CI

# Job test: ESLint, the unit tests of data/mantis.js, and the docs tour (e2e/docs/) as
# a render check: it loads the unpacked extension into headless Chromium, so a
# page that throws or a manifest Chromium rejects fails the push. Its
# screenshots go to the runner's temp dir; docs-screenshots.yml is the one that
# hands them out.
# Job e2e: the e2e suite (scripts/e2e.sh, e2e/COVERAGE.md); its results and
# traces come back as the `e2e-run` artifact when it fails.
on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Docs tour (render check)
        run: ARTIFACTS="$RUNNER_TEMP/docs-run" bash scripts/docs-screenshots.sh "$RUNNER_TEMP/screenshots"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E suite
        run: ARTIFACTS="$RUNNER_TEMP/e2e-run" bash scripts/e2e.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-run
          path: ${{ runner.temp }}/e2e-run/
          retention-days: 7
